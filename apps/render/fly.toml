# Fly.io configuration for the render service. From the repository root:
#   fly launch --no-deploy --copy-config --config apps/render/fly.toml --dockerfile apps/render/Dockerfile
#   fly secrets set RENDER_TOKEN=... SENTRY_DSN=... --config apps/render/fly.toml
#   fly deploy --config apps/render/fly.toml --dockerfile apps/render/Dockerfile .
app = "pencil-render"
primary_region = "bos"

[build]
  dockerfile = "apps/render/Dockerfile"

[env]
  PORT = "8787"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
